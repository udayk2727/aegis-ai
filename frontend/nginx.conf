# Serves the built dashboard and forwards the API prefix to the FastAPI service.
# The browser keeps requesting relative URLs (/api/v1/...), so it stays on one
# origin and needs no CORS rules.

# Docker's embedded DNS. The upstream is a variable below so that nginx looks the
# service name up on each request. A fixed name would be resolved once at startup,
# and a restarted API container gets a new address, which left the proxy with a 502.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The published port is read-only: the dashboard only reads. Any other
    # method is refused here, so the simulation endpoint is not reachable from
    # the host through this port.
    location /api/v1 {
        limit_except GET HEAD {
            deny all;
        }
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
