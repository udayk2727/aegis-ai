# Serves the built dashboard and forwards the API prefix to the FastAPI service.
# The browser keeps requesting relative URLs (/api/v1/...), so it stays on one
# origin and needs no CORS rules.

# Docker's embedded DNS. The upstream is a variable below so that nginx looks the
# service name up on each request. A fixed name would be resolved once at startup,
# and a restarted API container gets a new address, which left the proxy with a 502.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Host health probe. It answers from nginx alone, so it does not depend on
    # the API, and it never falls through to the dashboard's index.html.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The only API paths the dashboard calls, each with GET alone. The page is
    # read-only: the dashboard never needs another method or another route, so
    # the simulation, event, analytics and API documentation paths stay on the
    # internal network. Matching is on the decoded path, so an encoded slash in
    # an incident ID does not match and falls through to the 404 below.
    location ~ ^/api/v1/(demo/baselines|incidents|incidents/[^/]+/investigation)$ {
        # nginx's limit_except GET would still pass HEAD on, so test the method.
        if ($request_method != GET) {
            return 405;
        }
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Every other API path is refused here rather than served the dashboard page.
    location /api/ {
        return 404;
    }

    # The backend's documentation and its health probe are internal. Without this
    # they would fall through to the dashboard page and look like a 200.
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
